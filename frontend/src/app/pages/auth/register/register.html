<div class="container">
  <div class="title">Registro en BarberFlow</div>
  <div class="content">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="user-details">
        <!--Input Nombre-->
        <div class="input-box">
          <span class="details">Nombre Completo</span>
          <input type="text" formControlName="nombre" placeholder="Introduce tu nombre" required />
        </div>

        <!--Input Apellido-->
        <div class="input-box">
          <span class="details">Apellidos</span>
          <input
            type="text"
            formControlName="apellido"
            placeholder="Introduce tu apellido"
            required
          />
        </div>

        <!--Input correo-->
        <div class="input-box">
          <span class="details">Correo Electrónico</span>
          <input type="email" formControlName="email" placeholder="Introduce tu correo" required />
        </div>

        <!--Input teléfono-->
        <div class="input-box">
          <span class="details">Número de Teléfono</span>
          <input
            type="text"
            formControlName="telefono"
            placeholder="Introduce tu número de teléfono"
          />
        </div>

        <!--Input contraseña-->
        <div class="input-box">
          <span class="details">Contraseña</span>
          <input
            type="password"
            formControlName="password"
            placeholder="Introduce la contraseña"
            required
          />
        </div>
      </div>

      <div class="button">
        <input type="submit" value="Crear Cuenta" />
      </div>

      <div class="text-center mt-4">
        <p>
          ¿Ya tienes cuenta?
          <a [routerLink]="['/login']" style="color: #6366f1; font-weight: bold; cursor: pointer"
            >Inicia sesión</a
          >
        </p>
      </div>
    </form>
  </div>
</div>
