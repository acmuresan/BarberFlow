<div class="bf-auth-page">
  <div class="bf-auth-card">
    <!-- Brand -->
    <div class="bf-brand">
      <div class="bf-brand-logo text-white">B</div>
      <h1>BarberFlow</h1>
    </div>

    <!-- Alerta de error 401 -->
    <div *ngIf="errorMessage" class="alert-bf-error" role="alert">
      <span>✕</span>
      <span>{{ errorMessage }}</span>
    </div>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      aria-label="Formulario de inicio de sesión"
    >
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          formControlName="email"
          placeholder="tu@email.com"
          autocomplete="email"
          [attr.aria-invalid]="
            loginForm.get('email')?.invalid && loginForm.get('email')?.touched ? 'true' : 'false'
          "
          aria-describedby="email-error"
        />
        <div
          id="email-error"
          class="invalid-feedback"
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        >
          Introduce un email válido
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Contraseña</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn-bf-primary" [disabled]="loginForm.invalid || isLoading()">
        {{ isLoading() ? 'Cargando...' : 'Entrar' }}
      </button>
    </form>

    <p class="text-center mt-3" style="font-size: 14px; color: var(--bf-muted)">
      ¿No tienes cuenta? <a routerLink="/register" class="bf-link">Regístrate</a>
    </p>

    <div class="bf-divider">o</div>

    <a
      routerLink="/panel-publico"
      class="btn-bf-secondary"
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
        font-size: 14px;
      "
      aria-label="Ver el estado en tiempo real de la barbería"
    >
      Ver panel en vivo
    </a>
  </div>
</div>
