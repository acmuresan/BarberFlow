<div class="login-container">
  <h2>Iniciar Sesión en BarberFlow</h2>

  <div *ngIf="errorMessage" class="alert alert-error" role="alert">
    {{ errorMessage }}
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" aria-label="Formulario de inicio de sesión">
    <div class="form-group">
      <label for="email">Correo Electrónico</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="ejemplo@correo.com"
        [attr.aria-invalid]="
          loginForm.get('email')?.invalid && loginForm.get('email')?.touched ? 'true' : 'false'
        "
        aria-describedby="email-error"
      />
      <small
        id="email-error"
        class="error"
        role="alert"
        *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
      >
        Introduce un email válido.
      </small>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" placeholder="Tu contraseña" />
    </div>

    <button type="submit" [disabled]="loginForm.invalid || isLoading">
      {{ isLoading ? 'Cargando...' : 'Entrar' }}
    </button>
  </form>

  <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
</div>
