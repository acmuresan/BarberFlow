<div class="register-container">
  <h2>Crea tu cuenta en BarberFlow</h2>

  <div *ngIf="errorMessage" class="alert alert-error" role="alert">
    {{ errorMessage }}
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" aria-label="Formulario de registro">
    <div class="form-group">
      <label for="nombre">Nombre completo *</label>
      <input id="nombre" type="text" formControlName="nombre" placeholder="Juan Pérez" />
    </div>

    <div class="form-group">
      <label for="email">Correo Electrónico *</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="ejemplo@correo.com"
        [attr.aria-invalid]="
          registerForm.get('email')?.invalid && registerForm.get('email')?.touched
            ? 'true'
            : 'false'
        "
        aria-describedby="register-email-error"
      />
      <small
        id="register-email-error"
        class="error"
        role="alert"
        *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
      >
        Introduce un email válido.
      </small>
    </div>

    <div class="form-group">
      <label for="password">Contraseña *</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Mínimo 1 caracteres"
        [attr.aria-invalid]="
          registerForm.get('password')?.invalid && registerForm.get('password')?.touched
            ? 'true'
            : 'false'
        "
        aria-describedby="register-password-error"
      />
      <small
        id="register-password-error"
        class="error"
        role="alert"
        *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
      >
        La contraseña debe tener al menos 1 caracteres.
      </small>
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono (Opcional)</label>
      <input id="telefono" type="tel" formControlName="telefono" placeholder="600 000 000" />
    </div>

    <button type="submit" [disabled]="registerForm.invalid || isLoading()">
      {{ isLoading() ? 'Registrando...' : 'Registrarse' }}
    </button>
  </form>

  <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</div>
