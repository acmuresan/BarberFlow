<div class="register-container">
  <h2>Crea tu cuenta en BarberFlow</h2>

  <div *ngIf="errorMessage" class="alert alert-error">
    {{ errorMessage }}
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nombre">Nombre completo *</label>
      <input id="nombre" type="text" formControlName="nombre" placeholder="Juan Pérez" />
    </div>

    <div class="form-group">
      <label for="email">Correo Electrónico *</label>
      <input id="email" type="email" formControlName="email" placeholder="ejemplo@correo.com" />
    </div>

    <div class="form-group">
      <label for="password">Contraseña *</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Mínimo 6 caracteres"
      />
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono (Opcional)</label>
      <input id="telefono" type="tel" formControlName="telefono" placeholder="600 000 000" />
    </div>

    <button type="submit" [disabled]="registerForm.invalid || isLoading">
      {{ isLoading ? 'Creando cuenta...' : 'Registrarme' }}
    </button>
  </form>

  <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</div>
