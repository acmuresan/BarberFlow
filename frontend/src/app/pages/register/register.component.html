<div class="bf-auth-page">
  <div class="bf-auth-card">
    <!-- Brand -->
    <div class="bf-brand">
      <div class="bf-brand-logo text-white">B</div>
      <h1>BarberFlow</h1>
      <p>Crea tu cuenta</p>
    </div>

    <!-- Alerta de error 409 email duplicado -->
    <div *ngIf="errorMessage" class="alert-bf-error" role="alert">
      <span>✕</span>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" aria-label="Formulario de registro">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre completo</label>
        <input
          id="nombre"
          type="text"
          class="form-control"
          [class.is-invalid]="
            registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched
          "
          formControlName="nombre"
          placeholder="Tu nombre"
          autocomplete="name"
        />
        <div
          class="invalid-feedback"
          *ngIf="registerForm.get('nombre')?.touched && registerForm.get('nombre')?.invalid"
        >
          El nombre debe tener al menos 3 caracteres
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          [class.is-invalid]="
            registerForm.get('email')?.invalid && registerForm.get('email')?.touched
          "
          formControlName="email"
          placeholder="tu@email.com"
          autocomplete="email"
          [attr.aria-invalid]="
            registerForm.get('email')?.invalid && registerForm.get('email')?.touched
              ? 'true'
              : 'false'
          "
          aria-describedby="register-email-error"
        />
        <div
          id="register-email-error"
          class="invalid-feedback"
          *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
        >
          Introduce un email válido
        </div>
      </div>

      <div class="mb-3">
        <label for="telefono" class="form-label">
          Teléfono <span style="color: var(--bf-muted); font-weight: 400">(opcional)</span>
        </label>
        <input
          id="telefono"
          type="tel"
          class="form-control"
          formControlName="telefono"
          placeholder="+34 600 000 000"
          autocomplete="tel"
        />
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Contraseña</label>
        <input
          id="password"
          type="password"
          class="form-control"
          [class.is-invalid]="
            registerForm.get('password')?.invalid && registerForm.get('password')?.touched
          "
          formControlName="password"
          placeholder="Mínimo 8 caracteres"
          autocomplete="new-password"
          [attr.aria-invalid]="
            registerForm.get('password')?.invalid && registerForm.get('password')?.touched
              ? 'true'
              : 'false'
          "
          aria-describedby="register-password-error"
        />
        <div
          id="register-password-error"
          class="invalid-feedback"
          *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
        >
          La contraseña debe tener al menos 3 caracteres
        </div>
      </div>

      <button type="submit" class="btn-bf-primary" [disabled]="registerForm.invalid || isLoading()">
        {{ isLoading() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="text-center mt-3" style="font-size: 14px; color: var(--bf-muted)">
      ¿Ya tienes cuenta? <a routerLink="/login" class="bf-link">Inicia sesión</a>
    </p>
  </div>
</div>
