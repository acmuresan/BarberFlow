<div class="admin-container p-4 max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold mb-6 text-gray-900">Gestión de Barbería</h1>
  <div
    *ngIf="uiMessage"
    aria-live="polite"
    role="alert"
    class="mb-4 p-3 rounded shadow-sm text-sm font-medium transition-all"
    [ngClass]="{
      'bg-green-100 text-green-800 border border-green-200': uiMessage.type === 'success',
      'bg-red-100 text-red-800 border border-red-200': uiMessage.type === 'error',
    }"
  >
    {{ uiMessage.text }}
  </div>
  <div
    role="tablist"
    aria-label="Secciones de administración"
    class="flex gap-2 mb-6 bg-gray-200 p-1 rounded-lg"
  >
    <button
      role="tab"
      [attr.aria-selected]="view === 'barberos'"
      [attr.tabindex]="view === 'barberos' ? 0 : -1"
      (click)="view = 'barberos'; resetForms()"
      [class.bg-white]="view === 'barberos'"
      [class.shadow]="view === 'barberos'"
      class="flex-1 py-2 rounded-md transition font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"
    >
      Barberos
    </button>
    <button
      role="tab"
      [attr.aria-selected]="view === 'servicios'"
      [attr.tabindex]="view === 'servicios' ? 0 : -1"
      (click)="view = 'servicios'; resetForms()"
      [class.bg-white]="view === 'servicios'"
      [class.shadow]="view === 'servicios'"
      class="flex-1 py-2 rounded-md transition font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"
    >
      Servicios
    </button>
  </div>

  <section
    *ngIf="view === 'barberos'"
    role="tabpanel"
    aria-label="Panel de Barberos"
    class="fade-in"
  >
    <div class="card mb-6 p-4 bg-white shadow rounded">
      <h2 class="font-semibold mb-4 text-gray-800">{{ editingId ? 'Editar' : 'Nuevo' }} Barbero</h2>

      <form [formGroup]="barberoForm" (ngSubmit)="onSaveBarbero()" class="space-y-4">
        <div>
          <label for="b-nombre" class="sr-only">Nombre del barbero</label>
          <input
            id="b-nombre"
            formControlName="nombre"
            placeholder="Nombre completo"
            class="input-field w-full p-2 border rounded focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label for="b-especialidad" class="sr-only">Especialidad</label>
          <input
            id="b-especialidad"
            formControlName="especialidad"
            placeholder="Ej: Degradados, Barba"
            class="input-field w-full p-2 border rounded focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div class="flex flex-mobile-col gap-2 pt-2">
          <button
            type="submit"
            [disabled]="barberoForm.invalid || isLoading"
            class="btn-primary flex-1"
          >
            <span *ngIf="isLoading" aria-hidden="true">⏳</span>
            {{ isLoading ? 'Guardando...' : editingId ? 'Actualizar' : 'Añadir Barbero' }}
          </button>
          <button
            *ngIf="editingId"
            (click)="resetForms()"
            type="button"
            aria-label="Cancelar edición"
            class="btn-secondary w-full sm:w-auto"
          >
            Cancelar
          </button>
        </div>
      </form>
    </div>

    <div class="space-y-3" role="list">
      <div
        *ngFor="let b of barberos"
        role="listitem"
        class="flex justify-between items-center p-4 border rounded bg-white shadow-sm hover:shadow transition"
      >
        <div>
          <p
            class="font-bold text-gray-900"
            [class.line-through]="!b.activo"
            [class.text-gray-400]="!b.activo"
          >
            {{ b.nombre }}
          </p>
          <span class="text-sm text-gray-500">{{ b.especialidad }}</span>
        </div>
        <div class="flex flex-col sm:flex-row gap-2">
          <button
            (click)="editEntity(b, 'b')"
            aria-label="Editar barbero"
            class="p-2 text-blue-600 font-medium"
          >
            Editar
          </button>
          <button
            (click)="toggleBarberoActivo(b)"
            [attr.aria-label]="b.activo ? 'Desactivar barbero' : 'Activar barbero'"
            [class.text-red-600]="b.activo"
            [class.text-green-600]="!b.activo"
            class="p-2 font-medium"
          >
            {{ b.activo ? 'Baja' : 'Alta' }}
          </button>
        </div>
      </div>
    </div>
  </section>

  <section
    *ngIf="view === 'servicios'"
    role="tabpanel"
    aria-label="Panel de Servicios"
    class="fade-in"
  >
    <div class="card mb-6 p-4 bg-white shadow rounded">
      <h2 class="font-semibold mb-4 text-gray-800">
        {{ editingId ? 'Editar' : 'Nuevo' }} Servicio
      </h2>

      <form [formGroup]="servicioForm" (ngSubmit)="onSaveServicio()" class="space-y-4">
        <div>
          <label for="s-nombre" class="sr-only">Nombre del servicio</label>
          <input
            id="s-nombre"
            formControlName="nombre"
            placeholder="Nombre del servicio"
            class="input-field w-full p-2 border rounded focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div class="flex gap-2">
          <div class="w-1/2">
            <label for="s-precio" class="sr-only">Precio en euros</label>
            <input
              id="s-precio"
              type="number"
              formControlName="precio"
              placeholder="Precio €"
              class="input-field w-full p-2 border rounded focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div class="w-1/2">
            <label for="s-duracion" class="sr-only">Duración en minutos</label>
            <input
              id="s-duracion"
              type="number"
              formControlName="duracion"
              placeholder="Mins"
              class="input-field w-full p-2 border rounded focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>

        <div class="flex flex-mobile-col gap-2 pt-2">
          <button
            type="submit"
            [disabled]="servicioForm.invalid || isLoading"
            class="btn-primary flex-1"
          >
            <span *ngIf="isLoading" aria-hidden="true">⏳</span>
            {{ isLoading ? 'Guardando...' : editingId ? 'Actualizar' : 'Guardar Servicio' }}
          </button>

          <button
            *ngIf="editingId"
            (click)="resetForms()"
            type="button"
            aria-label="Cancelar edición"
            class="btn-secondary w-full sm:w-auto"
          >
            Cancelar
          </button>
        </div>
      </form>
    </div>

    <div class="space-y-3" role="list">
      <div
        *ngFor="let s of servicios"
        role="listitem"
        class="flex justify-between items-center p-4 border rounded bg-white shadow-sm hover:shadow transition"
      >
        <div>
          <p class="font-bold text-gray-900">{{ s.nombre }}</p>
          <span class="text-sm text-gray-500">{{ s.duracion }} min - {{ s.precio }}€</span>
        </div>
        <div>
          <button
            (click)="editEntity(s, 's')"
            aria-label="Editar servicio"
            class="p-2 text-blue-600 font-medium"
          >
            Editar
          </button>
        </div>
      </div>
    </div>
  </section>
</div>
