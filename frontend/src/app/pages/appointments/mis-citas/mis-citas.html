<div class="contenedor-citas p-4 max-w-4xl mx-auto">
  <h1 class="text-3xl font-bold mb-6 text-gray-800">Mis Citas</h1>

  <div
    *ngIf="citas.length === 0"
    class="aviso-vacio bg-gray-50 border-2 border-dashed p-10 text-center rounded-xl"
  >
    <p class="text-gray-500">No tienes citas pendientes en BarberFlow.</p>
    <button class="mt-4 bg-indigo-600 text-white px-6 py-2 rounded-lg">Reservar ahora</button>
  </div>

  <div *ngIf="citas.length > 0" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div
      *ngFor="let cita of citas"
      class="tarjeta-cita bg-white border shadow-sm p-5 rounded-xl hover:shadow-md transition"
    >
      <div class="flex justify-between items-start mb-2">
        <h3 class="font-bold text-lg text-indigo-900">{{ cita.servicio }}</h3>

        <span
          class="chip"
          [class.bg-pendiente]="cita.estado === 'pendiente'"
          [class.bg-confirmada]="cita.estado === 'confirmada'"
          [class.bg-cancelada]="cita.estado === 'cancelada'"
        >
          {{ cita.estado }}
        </span>
      </div>

      <p class="text-gray-600 mb-4">
        <span class="material-icons text-sm" style="vertical-align: middle">calendar_today</span>
        {{ cita.fecha | date: 'dd/MM/yyyy HH:mm' }}
      </p>

      <button
        *ngIf="cita.estado === 'pendiente'"
        (click)="cancelarCita(cita.id)"
        class="w-full py-2 border border-red-200 text-red-600 rounded-lg hover:bg-red-50 font-medium transition"
      >
        Cancelar Cita
      </button>
    </div>
  </div>
</div>
